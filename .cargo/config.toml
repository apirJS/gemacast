[env]
CMAKE_GENERATOR_aarch64_linux_android = "Ninja"
CMAKE_GENERATOR_armv7_linux_androideabi = "Ninja"
CMAKE_GENERATOR_x86_64_linux_android = "Ninja"
CMAKE_GENERATOR_i686_linux_android = "Ninja"

# macOS: rpath to the OS Swift runtime, needed by screencapturekit's Swift bridge.
# This covers `cargo test` only — gemacast-pc/build.rs is what covers the shipped
# binary, because `dist build` sets RUSTFLAGS and cargo then ignores the lines below.
[target.x86_64-apple-darwin]
rustflags = ["-C", "link-arg=-Wl,-rpath,/usr/lib/swift"]

[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-Wl,-rpath,/usr/lib/swift"]
