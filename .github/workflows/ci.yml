name: CI Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Rust Dependency Audit
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v6
      - name: Audit Rust dependencies
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ignore: RUSTSEC-2021-0119,RUSTSEC-2026-0194,RUSTSEC-2026-0195

  frontend:
    name: Frontend Checks (TypeScript / Tauri)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Cache Bun Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('gemacast-mobile/bun.lock') }}
          restore-keys: bun-
      - name: Install Dependencies
        working-directory: ./gemacast-mobile
        run: bun install --frozen-lockfile
      - name: Prettier Format Check
        working-directory: ./gemacast-mobile
        run: bun run format:check
      - name: ESLint
        working-directory: ./gemacast-mobile
        run: bun run lint
      - name: TypeScript Typecheck
        working-directory: ./gemacast-mobile
        run: bun run typecheck
      - name: Bun Test
        working-directory: ./gemacast-mobile
        run: bun test

  backend:
    name: Backend Checks (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux PC
            os: ubuntu-22.04
            target: pc
          - name: Linux Android
            os: ubuntu-24.04
            target: android
          - name: Windows PC
            os: windows-latest
            target: pc
          - name: macOS PC
            os: macos-15
            target: pc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      # Version lives only in rust-toolchain.toml; @master is required whenever the
      # toolchain input is passed explicitly.
      - name: Resolve pinned Rust version
        id: rust
        shell: bash
        run: sed -n 's/^channel = "\(.*\)"/version=\1/p' rust-toolchain.toml >> "$GITHUB_OUTPUT"
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          components: clippy, rustfmt
      - name: Add Android targets
        if: matrix.target == 'android'
        run: rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
      - name: Install Linux Dependencies
        if: contains(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libgtk-3-dev libayatana-appindicator3-dev \
            libwebkit2gtk-4.1-dev librsvg2-dev patchelf libxdo-dev dbus-x11 clang \
            meson ninja-build pkg-config libudev-dev libdbus-1-dev python3-docutils \
            libglib2.0-dev liblua5.3-dev
          # PipeWire 1.2.7 from source: apt on 22.04 ships 0.3.48 headers, pipewire-rs 0.10 needs 1.2.x.
          PW_VERSION=1.2.7
          curl -fsSL --retry 3 --retry-delay 5 "https://github.com/PipeWire/pipewire/archive/refs/tags/${PW_VERSION}.tar.gz" | tar xz
          cd "pipewire-${PW_VERSION}"
          meson setup builddir --prefix=/usr \
            -Dpipewire-v4l2=disabled -Dpipewire-jack=disabled \
            -Dpipewire-alsa=disabled -Dlibjack-path="" -Dalsa=disabled \
            -Dsession-managers=[] -Dtests=disabled -Dexamples=disabled -Dman=disabled \
            -Ddocs=disabled -Dgstreamer=disabled -Dbluez5=disabled -Davahi=disabled \
            -Draop=disabled -Dudevrulesdir=""
          ninja -C builddir
          sudo ninja -C builddir install
          sudo ldconfig
          cd ..
          rm -rf "pipewire-${PW_VERSION}"
          # WirePlumber 0.5.15 from source: apt 0.4.8 targets the 0.3.48 ABI and spams
          # "impl_ext_end_proxy called from wrong context" against our 1.2.7 daemon.
          WP_VERSION=0.5.15
          curl -fsSL --retry 3 --retry-delay 5 "https://github.com/PipeWire/wireplumber/archive/refs/tags/${WP_VERSION}.tar.gz" | tar xz
          cd "wireplumber-${WP_VERSION}"
          meson setup builddir --prefix=/usr \
            -Dtests=false -Ddoc=disabled -Dintrospection=disabled -Dsystem-lua=true
          ninja -C builddir
          sudo ninja -C builddir install
          sudo ldconfig
          cd ..
          rm -rf "wireplumber-${WP_VERSION}"
      - name: Setup Java
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Setup Android SDK & NDK
        if: matrix.target == 'android'
        uses: android-actions/setup-android@v3
      - name: Install Pinned NDK & Build Tools
        if: matrix.target == 'android'
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1" "build-tools;34.0.0" "platforms;android-36"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "BUILD_TOOLS_VERSION=34.0.0" >> $GITHUB_ENV
      - name: Rustfmt
        run: cargo fmt --check
      - name: Clippy PC
        if: matrix.target == 'pc'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy Android
        if: matrix.target == 'android'
        # These env vars are what generate the four gitignored artifacts `:app` cannot be
        # configured without — tauri-build's generate_gradle_files and wry's/tauri's build.rs
        # emit them only when set, so the lint pass we already run does the generation.
        # Values mirror `identifier` in tauri.conf.json and the src-tauri lib name.
        env:
          TAURI_ANDROID_PROJECT_PATH: ${{ github.workspace }}/gemacast-mobile/src-tauri/gen/android
          WRY_ANDROID_PACKAGE: com.apir.gemacast
          WRY_ANDROID_LIBRARY: gemacast_mobile_lib
          WRY_ANDROID_KOTLIN_FILES_OUT_DIR: ${{ github.workspace }}/gemacast-mobile/src-tauri/gen/android/app/src/main/java/com/apir/gemacast/generated
        run: |
          cargo install cargo-ndk --force
          # wry canonicalizes this path, so it must exist before cargo runs.
          mkdir -p "$WRY_ANDROID_KOTLIN_FILES_OUT_DIR"
          cargo ndk -t arm64-v8a clippy --workspace --exclude gemacast-pc -- -D warnings
      - name: Android JVM Unit Tests
        if: matrix.target == 'android'
        working-directory: ./gemacast-mobile/src-tauri/gen/android
        run: bash ./gradlew :app:testUniversalDebugUnitTest --no-daemon
      - name: Cargo Test (macOS/Windows)
        if: matrix.target == 'pc' && !contains(matrix.os, 'ubuntu')
        # No RUSTFLAGS: it would override the macOS Swift rpath in .cargo/config.toml.
        run: cargo test --workspace
      - name: Cargo Test (Linux with PipeWire)
        if: matrix.target == 'pc' && contains(matrix.os, 'ubuntu')
        timeout-minutes: 25
        run: |
          export XDG_RUNTIME_DIR=/tmp/runtime-dir
          mkdir -p $XDG_RUNTIME_DIR
          chmod 0700 $XDG_RUNTIME_DIR
          # WirePlumber handles the session management some tests need; PipeWire stderr is
          # suppressed to hide harmless headless "XOpenDisplay() failed" warnings.
          PIPEWIRE_LOG_LEVEL=2 dbus-run-session -- sh -c '
            pipewire 2>/dev/null &
            sleep 2
            wireplumber 2>/dev/null &
            sleep 2
            cargo test --workspace
          '
      - name: OS Volume Reader Tests (Windows)
        if: matrix.target == 'pc' && contains(matrix.os, 'windows')
        run: |
          cargo test -p gemacast-core output_volume -- --nocapture
          cargo test -p gemacast-pc volume_watcher -- --nocapture
      - name: OS Volume Reader Tests (macOS)
        if: matrix.target == 'pc' && contains(matrix.os, 'macos')
        run: |
          if osascript -e 'output volume of (get volume settings)' >/dev/null 2>&1; then
            export GEMACAST_EXPECT_OS_VOLUME=1
          fi
          cargo test -p gemacast-core output_volume -- --nocapture
          cargo test -p gemacast-pc volume_watcher -- --nocapture
      - name: OS Volume Reader Tests (Linux)
        if: matrix.target == 'pc' && contains(matrix.os, 'ubuntu')
        timeout-minutes: 10
        run: |
          export XDG_RUNTIME_DIR=/tmp/runtime-dir
          mkdir -p $XDG_RUNTIME_DIR
          chmod 0700 $XDG_RUNTIME_DIR
          PIPEWIRE_LOG_LEVEL=2 dbus-run-session -- sh -c '
            pipewire 2>/dev/null &
            sleep 2
            wireplumber 2>/dev/null &
            sleep 2
            if wpctl get-volume @DEFAULT_AUDIO_SINK@ >/dev/null 2>&1; then
              export GEMACAST_EXPECT_OS_VOLUME=1
            fi
            cargo test -p gemacast-core output_volume -- --nocapture
            cargo test -p gemacast-pc volume_watcher -- --nocapture
          '
