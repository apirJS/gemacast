# This file was autogenerated by dist: https://axodotdev.github.io/cargo-dist
#
# Copyright 2022-2024, axodotdev
# SPDX-License-Identifier: MIT or Apache-2.0
#
# CI that:
#
# * checks for a Git Tag that looks like a release
# * builds artifacts with dist (archives, installers, hashes)
# * uploads those artifacts to temporary workflow zip
# * on success, uploads the artifacts to a GitHub Release
# * tests all platform-specific installers (MSI, deb, rpm, AppImage, DMG, APK)
# * on any failure after release creation, rolls back (deletes tag + release, reverts versions)
#

name: Release
permissions:
  "contents": "write"

# This task will run whenever you push a git tag that looks like a version
# like "1.0.0", "v0.1.0-prerelease.1", "my-app/0.1.0", "releases/v1.0.0", etc.
on:
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

# Initialize the placeholder here so IDE knows it exists
# Value will filled later
env:
  MSI_PATH: "" 

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # Phase 0: Plan
  # ═══════════════════════════════════════════════════════════════════════════
  plan:
    runs-on: "ubuntu-24.04"
    outputs:
      val: ${{ steps.plan.outputs.manifest }}
      tag: ${{ github.ref_name }}
      tag-flag: ${{ format('--tag={0}', github.ref_name) }}
      publishing: "true"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install dist
        shell: bash
        run: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh"
      - name: Cache dist
        uses: actions/upload-artifact@v7
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/dist
      - id: plan
        run: |
          dist host --steps=create --tag=${{ github.ref_name }} --output-format=json > plan-dist-manifest.json
          echo "dist ran successfully"
          cat plan-dist-manifest.json
          echo "manifest=$(jq -c "." plan-dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-plan-dist-manifest
          path: plan-dist-manifest.json

  # ═══════════════════════════════════════════════════════════════════════════
  # Phase 1: Build cargo-dist artifacts
  # ═══════════════════════════════════════════════════════════════════════════
  build-local-artifacts:
    name: build-local-artifacts (${{ join(matrix.targets, ', ') }})
    needs:
      - plan
    if: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix.include != null && (needs.plan.outputs.publishing == 'true' || fromJson(needs.plan.outputs.val).ci.github.pr_run_mode == 'upload') }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.val).ci.github.artifacts_matrix }}
    runs-on: ${{ contains(matrix.targets, 'aarch64-unknown-linux-gnu') && 'ubuntu-22.04-arm' || (startsWith(matrix.runner, 'ubuntu') && 'ubuntu-22.04' || matrix.runner) }}
    container: ${{ matrix.container && matrix.container.image || null }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/${{ join(matrix.targets, '-') }}-dist-manifest.json
    steps:
      - name: enable windows longpaths
        run: |
          git config --global core.longpaths true
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Rust non-interactively if not already installed
        if: ${{ matrix.container }}
        run: |
          if ! command -v cargo > /dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          fi
      - name: Install dist
        run: ${{ matrix.install_dist.run }}
      - name: Throttle Mac Compilers to prevent OOM crash
        if: contains(matrix.runner, 'macos')
        run: echo "CARGO_BUILD_JOBS=2" >> $GITHUB_ENV
      - name: Fetch local artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - name: Install dependencies
        shell: bash
        run: |
          ${{ matrix.packages_install }}
          if [[ "${{ matrix.runner }}" == ubuntu* ]]; then
            sudo apt-get update && sudo apt-get install -y clang libasound2-dev libgtk-3-dev \
              libayatana-appindicator3-dev libwebkit2gtk-4.1-dev librsvg2-dev patchelf libxdo-dev \
              ninja-build cmake meson pkg-config libudev-dev libdbus-1-dev python3-docutils python3-pip

            # Install cargo-zigbuild and ziglang for Linux ARM cross-compilation
            pip3 install cargo-zigbuild ziglang --break-system-packages || pip3 install cargo-zigbuild ziglang

            # Build PipeWire from source
            .github/scripts/install-pipewire.sh
          fi
      - name: Build artifacts
        run: |
          # Actually do builds and make zips and whatnot
          dist build ${{ needs.plan.outputs.tag-flag }} --print=linkage --output-format=json ${{ matrix.dist_args }} > dist-manifest.json
          echo "dist ran successfully"
      - name: Verify ADB is bundled in artifacts
        shell: bash
        env:
          MANIFEST_PATH: dist-manifest.json
        run: .github/scripts/verify-adb-in-archives.sh
      - id: cargo-dist
        name: Post-build
        shell: bash
        run: |
          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          dist print-upload-files-from-manifest --manifest dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-build-local-${{ join(matrix.targets, '_') }}
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  build-global-artifacts:
    needs:
      - plan
      - build-local-artifacts
    runs-on: "ubuntu-24.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUILD_MANIFEST_NAME: target/distrib/global-dist-manifest.json
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@v8
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      - name: Fetch local artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: cargo-dist
        shell: bash
        run: |
          dist build ${{ needs.plan.outputs.tag-flag }} --output-format=json "--artifacts=global" > dist-manifest.json
          echo "dist ran successfully"

          echo "paths<<EOF" >> "$GITHUB_OUTPUT"
          jq --raw-output ".upload_files[]" dist-manifest.json >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          cp dist-manifest.json "$BUILD_MANIFEST_NAME"
      - name: "Upload artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-build-global
          path: |
            ${{ steps.cargo-dist.outputs.paths }}
            ${{ env.BUILD_MANIFEST_NAME }}

  # ═══════════════════════════════════════════════════════════════════════════
  # Phase 2: Create GitHub Release
  # ═══════════════════════════════════════════════════════════════════════════
  host:
    needs:
      - plan
      - build-local-artifacts
      - build-global-artifacts
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.publishing == 'true' && (needs.build-global-artifacts.result == 'skipped' || needs.build-global-artifacts.result == 'success') && (needs.build-local-artifacts.result == 'skipped' || needs.build-local-artifacts.result == 'success') }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    runs-on: "ubuntu-24.04"
    outputs:
      val: ${{ steps.host.outputs.manifest }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install cached dist
        uses: actions/download-artifact@v8
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - run: chmod +x ~/.cargo/bin/dist
      - name: Fetch artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: target/distrib/
          merge-multiple: true
      - id: host
        shell: bash
        run: |
          dist host ${{ needs.plan.outputs.tag-flag }} --steps=upload --steps=release --output-format=json > dist-manifest.json
          echo "artifacts uploaded and released successfully"
          cat dist-manifest.json
          echo "manifest=$(jq -c "." dist-manifest.json)" >> "$GITHUB_OUTPUT"
      - name: "Upload dist-manifest.json"
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-dist-manifest
          path: dist-manifest.json
      - name: "Download GitHub Artifacts"
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: artifacts
          merge-multiple: true
      - name: Cleanup
        run: |
          # Remove the granular manifests
          rm -f artifacts/*-dist-manifest.json
      - name: Create GitHub Release
        env:
          PRERELEASE_FLAG: "${{ fromJson(steps.host.outputs.manifest).announcement_is_prerelease && '--prerelease' || '' }}"
          ANNOUNCEMENT_TITLE: "${{ fromJson(steps.host.outputs.manifest).announcement_title }}"
          ANNOUNCEMENT_BODY: "${{ fromJson(steps.host.outputs.manifest).announcement_github_body }}"
          RELEASE_COMMIT: "${{ github.sha }}"
        run: |
          # Write and read notes from a file to avoid quoting breaking things
          echo "$ANNOUNCEMENT_BODY" > $RUNNER_TEMP/notes.txt

          # Upload artifacts to the release created by release-please
          gh release upload "${{ needs.plan.outputs.tag }}" artifacts/* --clobber
          
          # Append the cargo-dist checksum table to the release-please changelog
          OLD_BODY=$(gh release view "${{ needs.plan.outputs.tag }}" --json body -q .body)
          echo -e "$OLD_BODY\n\n$(cat $RUNNER_TEMP/notes.txt)" > $RUNNER_TEMP/combined_notes.txt
          gh release edit "${{ needs.plan.outputs.tag }}" --notes-file "$RUNNER_TEMP/combined_notes.txt"

  # ═══════════════════════════════════════════════════════════════════════════
  # Phase 3: Build platform-specific installers
  # ═══════════════════════════════════════════════════════════════════════════

  # ── Windows MSI ──────────────────────────────────────────────────────────
  build-msi:
    name: Build Windows MSI Installer
    needs:
      - plan
      - host
    runs-on: windows-latest
    if: ${{ needs.host.result == 'success' }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Parse version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ needs.plan.outputs.tag }}"
          $version = $tag -replace '^v', ''
          echo "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Parsed version: $version from tag: $tag"

      - name: Download cargo-dist Windows archive
        shell: pwsh
        run: |
          Write-Host "Downloading Windows archive from release $env:TAG..."
          gh release download $env:TAG `
            -p "gemacast-pc-x86_64-pc-windows-msvc.zip" `
            --dir dist_download

          $zipFile = Get-ChildItem -Path dist_download -Filter "*.zip" | Select-Object -First 1
          if (-not $zipFile) {
            Write-Error "No Windows .zip found in release $env:TAG"
            exit 1
          }

          Write-Host "Extracting $($zipFile.Name)..."
          Expand-Archive -Path $zipFile.FullName -DestinationPath dist_extracted

      - name: Stage binaries for WiX
        shell: pwsh
        env:
          DIST_EXTRACTED: dist_extracted
        run: .github\scripts\stage-wix-binaries.ps1

      - name: Install WiX v6 toolset
        run: dotnet tool install --global wix --version 6.0.2

      - name: Build MSI
        shell: pwsh
        run: .github\scripts\build-msi.ps1

      - name: Upload MSI as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: installer-msi
          path: ${{ env.MSI_PATH }} 
          retention-days: 1

      - name: Upload installer to GitHub Release
        shell: pwsh
        run: |
          Write-Host "Uploading gemacast-pc-x86_64-pc-windows-msvc.msi to release $env:TAG..."
          gh release upload $env:TAG $env:MSI_PATH --clobber
          Write-Host "Upload complete!"

  # ── Linux packages (.deb, .rpm, .AppImage) ──────────────────────────────
  build-linux-packages:
    name: Build Linux Packages (${{ matrix.arch }})
    needs:
      - plan
      - host
    if: ${{ needs.host.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            rust_target: x86_64-unknown-linux-gnu
            appimage_arch: x86_64
            runs_on: ubuntu-22.04
          - arch: arm64
            rust_target: aarch64-unknown-linux-gnu
            appimage_arch: aarch64
            runs_on: ubuntu-22.04-arm
    runs-on: ${{ matrix.runs_on }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Parse version from tag
        run: |
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Download cargo-dist binary archive
        run: |
          gh release download "$TAG" \
            -p "gemacast-pc-${{ matrix.rust_target }}.tar.xz" \
            --dir dist_download
          mkdir -p dist_extracted
          tar -xJf dist_download/*.tar.xz -C dist_extracted --strip-components=1

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 file

      - name: Build .deb package
        env:
          ARCH: ${{ matrix.arch }}
          DIST_EXTRACTED: dist_extracted
        run: .github/scripts/build-deb.sh

      - name: Build .rpm package
        env:
          ARCH: ${{ matrix.arch }}
          APPIMAGE_ARCH: ${{ matrix.appimage_arch }}
        run: |
          sudo apt-get install -y alien rpm
          .github/scripts/build-rpm.sh

      - name: Build AppImage
        env:
          ARCH: ${{ matrix.appimage_arch }}
          DIST_EXTRACTED: dist_extracted
        run: .github/scripts/build-appimage.sh

      - name: Upload packages as workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: installer-linux-${{ matrix.arch }}
          path: |
            gemacast-pc_*.deb
            gemacast-pc-*.rpm
            gemacast-pc-*.AppImage
          retention-days: 1

      - name: Upload packages to GitHub Release
        run: |
          gh release upload "$TAG" \
            gemacast-pc_*.deb \
            gemacast-pc-*.rpm \
            gemacast-pc-*.AppImage \
            --clobber

  # ── macOS DMG & App Bundle ──────────────────────────────────────────────
  build-macos-dmg:
    name: Build macOS DMG & App Bundle
    needs:
      - plan
      - host
    if: ${{ needs.host.result == 'success' }}
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Parse version
        run: |
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Download macOS archives
        run: |
          gh release download "$TAG" \
            -p "gemacast-pc-aarch64-apple-darwin.tar.xz" \
            -p "gemacast-pc-x86_64-apple-darwin.tar.xz" \
            --dir mac_download
          mkdir -p mac_x64 mac_arm64
          tar -xJf mac_download/*x86_64*.tar.xz -C mac_x64 --strip-components=1
          tar -xJf mac_download/*aarch64*.tar.xz -C mac_arm64 --strip-components=1

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create .app bundles
        run: .github/scripts/create-macos-app-bundles.sh

      - name: Create universal .app bundle
        run: .github/scripts/create-macos-universal.sh

      - name: Create .app.tar.gz archives
        run: |
          tar -czf "gemacast-pc-x64-apple-darwin.app.tar.gz" "Gemacast-x64.app"
          tar -czf "gemacast-pc-aarch64-apple-darwin.app.tar.gz" "Gemacast-aarch64.app"
          tar -czf "gemacast-pc-universal-apple-darwin.app.tar.gz" "Gemacast-universal.app"

      - name: Create DMG files
        run: .github/scripts/create-dmg.sh

      - name: Upload to GitHub Release
        run: |
          gh release upload "$TAG" \
            gemacast-pc-*-apple-darwin.dmg \
            gemacast-pc-*-apple-darwin.app.tar.gz \
            --clobber

  # ── Android APK ──────────────────────────────────────────────────────────
  build-android:
    name: Build Android APK
    needs:
      - plan
      - host
    if: ${{ needs.host.result == 'success' }}
    runs-on: ubuntu-24.04
    environment: Production
    env:
      RELEASE_TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('gemacast-mobile/bun.lock') }}
          restore-keys: bun-

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
      
      - name: Install Pinned NDK & Build Tools
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1" "build-tools;34.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "BUILD_TOOLS_VERSION=34.0.0" >> $GITHUB_ENV

      - name: Setup Rust Mobile Targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libasound2-dev libxdo-dev clang

      - name: Force Reinstall cargo-ndk
        run: cargo install cargo-ndk --force

      - name: Install Frontend Dependencies
        working-directory: ./gemacast-mobile
        run: bun install --frozen-lockfile

      - name: Sync package.json and tauri.conf.json version with Cargo.toml
        working-directory: ./gemacast-mobile
        run: |
          VERSION=$(grep '^version = ' ../Cargo.toml | head -n 1 | cut -d '"' -f 2)
          echo "Syncing versions to v$VERSION"
          jq --arg v "$VERSION" '.version = $v' package.json > package.tmp.json && mv package.tmp.json package.json
          # Sync tauri.conf.json version
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > src-tauri/tauri.conf.tmp && mv src-tauri/tauri.conf.tmp src-tauri/tauri.conf.json

      - name: Build Unsigned APK via Tauri
        working-directory: ./gemacast-mobile
        run: |
          bunx tauri android build --apk

      - name: Cryptographically Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: gemacast-mobile/src-tauri/gen/android/app/build/outputs/apk/universal/release
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Rename Signed APK
        run: |
          cp "${{ steps.sign_app.outputs.signedReleaseFile }}" "gemacast-mobile.apk"
          echo "Renamed APK to gemacast-mobile.apk"
          ls -la gemacast-mobile.apk

      - name: Archive Signed APK
        uses: actions/upload-artifact@v7
        with:
          name: installer-android
          path: gemacast-mobile.apk
          retention-days: 1

      - name: Upload Signed APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_TAG" "gemacast-mobile.apk" --clobber

  # ═══════════════════════════════════════════════════════════════════════════
  # Phase 4: Test installers
  # ═══════════════════════════════════════════════════════════════════════════

  # ── Test MSI ─────────────────────────────────────────────────────────────
  test-msi:
    name: Test MSI Installer
    needs:
      - plan
      - build-msi
    runs-on: windows-latest
    if: ${{ needs.build-msi.result == 'success' }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download MSI from release
        shell: pwsh
        run: |
          $tag = $env:TAG
          $version = $tag -replace '^v', ''
          gh release download $tag -p "gemacast-pc-x86_64-pc-windows-msvc.msi" --dir msi_download
          $msi = Get-ChildItem -Path msi_download -Filter "*.msi" | Select-Object -First 1
          if (-not $msi) { Write-Error "MSI not found in release"; exit 1 }
          echo "MSI_PATH=$($msi.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Downloaded: $($msi.FullName)"

      - name: Test MSI (install, verify, uninstall, verify cleanup)
        shell: pwsh
        run: .github\scripts\test-msi.ps1

  # ── Test Linux packages ──────────────────────────────────────────────────
  test-linux-packages:
    name: Test Linux Packages (${{ matrix.arch }})
    needs:
      - plan
      - build-linux-packages
    if: ${{ needs.build-linux-packages.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            appimage_arch: x86_64
            runs_on: ubuntu-24.04
          - arch: arm64
            appimage_arch: aarch64
            runs_on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs_on }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Parse version and download packages
        run: |
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "ARCH=${{ matrix.arch }}" >> $GITHUB_ENV
          echo "APPIMAGE_ARCH=${{ matrix.appimage_arch }}" >> $GITHUB_ENV
          
          gh release download "$TAG" \
            -p "gemacast-pc_${VERSION}_${{ matrix.arch }}.deb" \
            -p "gemacast-pc-${VERSION}.${{ matrix.appimage_arch }}.rpm" \
            -p "gemacast-pc-${VERSION}-${{ matrix.appimage_arch }}.AppImage" \
            --dir .

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libfuse2 file libayatana-appindicator3-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libasound2-dev libxdo-dev zenity pipewire

      - name: Test .deb (install, verify, uninstall, verify cleanup)
        run: .github/scripts/test-deb.sh

      - name: Verify .rpm structure
        run: .github/scripts/test-rpm-structure.sh

      - name: Test AppImage
        env:
          ARCH: ${{ matrix.appimage_arch }}
        run: .github/scripts/test-appimage.sh

  # ── Test RPM in Fedora container ─────────────────────────────────────────
  test-rpm:
    name: Test RPM Installation (${{ matrix.arch }})
    needs:
      - plan
      - build-linux-packages
    if: ${{ needs.build-linux-packages.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            appimage_arch: x86_64
            runs_on: ubuntu-24.04
          - arch: arm64
            appimage_arch: aarch64
            runs_on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs_on }}
    container: fedora:latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - name: Install gh CLI
        run: dnf install -y gh

      - name: Download RPM from release
        run: |
          VERSION="${TAG#v}"
          mkdir -p rpm_download
          gh release download "$TAG" \
            -p "gemacast-pc-${VERSION}.${{ matrix.appimage_arch }}.rpm" \
            --dir rpm_download \
            --repo ${{ github.repository }}

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test RPM (install, verify, smoke test, uninstall)
        env:
          RPM_DIR: rpm_download
        run: .github/scripts/test-rpm-fedora.sh

  # ── Test macOS DMG ──────────────────────────────────────────────────────
  test-macos-dmg:
    name: Test macOS DMG & App Bundle
    needs:
      - plan
      - build-macos-dmg
    if: ${{ needs.build-macos-dmg.result == 'success' }}
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Parse version and download macOS installers
        run: |
          VERSION="${TAG#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

          gh release download "$TAG" \
            -p "gemacast-pc-*-apple-darwin.dmg" \
            -p "gemacast-pc-*-apple-darwin.app.tar.gz" \
            -p "gemacast-pc-aarch64-apple-darwin.tar.xz" \
            -p "gemacast-pc-x86_64-apple-darwin.tar.xz" \
            --dir .

      - name: Extract archives and create .app bundles for verification
        run: |
          # Extract raw binaries for .app bundle creation
          mkdir -p mac_x64 mac_arm64
          tar -xJf gemacast-pc-x86_64-apple-darwin.tar.xz -C mac_x64 --strip-components=1
          tar -xJf gemacast-pc-aarch64-apple-darwin.tar.xz -C mac_arm64 --strip-components=1

          # Recreate .app bundles (matching the build step)
          .github/scripts/create-macos-app-bundles.sh
          .github/scripts/create-macos-universal.sh

          # Extract .app.tar.gz archives for content verification
          # (the test script verifies these can be extracted and contain the binary)

      - name: Test macOS installers
        run: .github/scripts/test-macos.sh

  # ── Test Android APK ────────────────────────────────────────────────────
  test-android-apk:
    name: Test Android APK
    needs:
      - plan
      - build-android
    if: ${{ needs.build-android.result == 'success' }}
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download APK from release
        run: |
          gh release download "$TAG" -p "gemacast-mobile.apk" --dir .
          echo "APK_PATH=$(pwd)/gemacast-mobile.apk" >> $GITHUB_ENV

      - name: Verify APK metadata
        run: |
          # Setup Android SDK for aapt2
          sudo apt-get update && sudo apt-get install -y android-sdk-build-tools

          AAPT2=$(find /usr -name "aapt2" 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$AAPT2" ]; then
            "$AAPT2" dump badging "$APK_PATH" | head -20
            PKG=$("$AAPT2" dump badging "$APK_PATH" | grep "package:" | head -1)
            if echo "$PKG" | grep -q "com.apir.gemacast"; then
              echo "PASS: Package name is com.apir.gemacast"
            else
              echo "FAIL: Unexpected package name: $PKG"
              exit 1
            fi
          else
            echo "::notice::aapt2 not found, skipping APK metadata check"
          fi

      - name: Install and launch APK on emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 31
          arch: x86_64
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: .github/scripts/test-android-emulator.sh

  # ── Installer tests gate ─────────────────────────────────────────────────
  installer-tests-gate:
    name: All Installer Tests Passed
    needs:
      - test-msi
      - test-linux-packages
      - test-rpm
      - test-macos-dmg
      - test-android-apk
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Check results
        run: |
          echo "=== Installer Test Results ==="
          echo "MSI:            ${{ needs.test-msi.result }}"
          echo "Linux packages: ${{ needs.test-linux-packages.result }}"
          echo "Fedora RPM:     ${{ needs.test-rpm.result }}"
          echo "macOS DMG:      ${{ needs.test-macos-dmg.result }}"
          echo "Android APK:    ${{ needs.test-android-apk.result }}"
          echo ""

          FAILED=0
          for result in \
            "${{ needs.test-msi.result }}" \
            "${{ needs.test-linux-packages.result }}" \
            "${{ needs.test-rpm.result }}" \
            "${{ needs.test-macos-dmg.result }}" \
            "${{ needs.test-android-apk.result }}"; do
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              FAILED=$((FAILED+1))
            fi
          done

          if [ $FAILED -gt 0 ]; then
            echo "::error::$FAILED installer test job(s) failed"
            exit 1
          fi
          echo "All installer tests passed!"

  # ═══════════════════════════════════════════════════════════════════════════
  # Phase 5: Finalize (sign, updater, announce)
  # ═══════════════════════════════════════════════════════════════════════════

  # ── GPG Sign ─────────────────────────────────────────────────────────────
  sign-release:
    name: Sign Release Assets (GPG)
    needs:
      - plan
      - host
      - installer-tests-gate
    if: ${{ always() && needs.host.result == 'success' && needs.installer-tests-gate.result == 'success' }}
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          KEY_COUNT=$(gpg --list-secret-keys --keyid-format SHORT 2>/dev/null | grep -c '^sec' || true)
          if [ "$KEY_COUNT" -eq 0 ]; then
            echo "::error::GPG key import failed — no secret keys found"
            exit 1
          fi
          echo "GPG key imported successfully ($KEY_COUNT secret key(s))"

      - name: Download all release assets
        run: |
          mkdir -p assets
          gh release download "$TAG" --dir assets --repo ${{ github.repository }}

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Sign all assets
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: .github/scripts/sign-release-assets.sh

      - name: Upload signatures
        run: gh release upload "$TAG" assets/*.sig --clobber --repo ${{ github.repository }}

  # ── Generate updater.json ────────────────────────────────────────────────
  generate-updater:
    name: Generate updater.json
    needs:
      - plan
      - host
      - sign-release
    if: ${{ always() && needs.host.result == 'success' && needs.sign-release.result == 'success' }}
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.plan.outputs.tag }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Generate updater.json
        run: .github/scripts/generate-updater.sh

      - name: Upload updater.json
        run: gh release upload "$TAG" updater.json --clobber --repo "$REPO"

  # ── Announce ─────────────────────────────────────────────────────────────
  announce:
    needs:
      - plan
      - host
      - sign-release
      - generate-updater
    if: ${{ always() && needs.host.result == 'success' && (needs.sign-release.result == 'skipped' || needs.sign-release.result == 'success') && (needs.generate-updater.result == 'skipped' || needs.generate-updater.result == 'success') }}
    runs-on: "ubuntu-24.04"
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.plan.outputs.tag }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Generate and Update Release Notes
        run: .github/scripts/generate-release-notes.sh

  # ═══════════════════════════════════════════════════════════════════════════
  # Rollback: Runs on failure after release was created
  # ═══════════════════════════════════════════════════════════════════════════
  rollback:
    name: "⚠️ Rollback Failed Release"
    needs:
      - plan
      - host
      - build-msi
      - build-linux-packages
      - build-macos-dmg
      - build-android
      - test-msi
      - test-linux-packages
      - test-rpm
      - test-macos-dmg
      - test-android-apk
      - installer-tests-gate
      - sign-release
    if: >-
      always() && needs.host.result == 'success' &&
      (needs.build-msi.result == 'failure' ||
       needs.build-linux-packages.result == 'failure' ||
       needs.build-macos-dmg.result == 'failure' ||
       needs.build-android.result == 'failure' ||
       needs.test-msi.result == 'failure' ||
       needs.test-linux-packages.result == 'failure' ||
       needs.test-rpm.result == 'failure' ||
       needs.test-macos-dmg.result == 'failure' ||
       needs.test-android-apk.result == 'failure' ||
       needs.installer-tests-gate.result == 'failure' ||
       needs.sign-release.result == 'failure')
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
      TAG: ${{ needs.plan.outputs.tag }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Rollback release
        run: .github/scripts/rollback-release.sh
