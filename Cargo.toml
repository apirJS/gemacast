[workspace]
resolver = "2"
members = ["gemacast-core", "gemacast-pc", "gemacast-mobile/src-tauri"]

[workspace.package]
version = "0.3.0"
edition = "2024"
authors = ["Echa Apriliyanto <echa.apriliyanto.dev@gmail.com>"]
homepage = "https://github.com/apirJS/gemacast"
description = "Low-latency real-time audio streaming from PC to Android over a local network and ADB."
repository = "https://github.com/apirJS/gemacast"
keywords = ["audio", "streaming"]
categories = ["multimedia"]


[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

# Optimize dependencies (opus, rubato, cpal, oboe) at -O3 even in debug builds so
# real-time audio does not underrun/glitch during development. Own crates stay at
# the default dev opt-level, so iteration compile speed is unaffected. Does not
# touch the shipped release binary.
[profile.dev.package."*"]
opt-level = 3

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[patch.crates-io]
audiopus_sys = { path = "vendor/audiopus_sys" }
 