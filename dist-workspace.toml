[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.32.0"
ci = "github"

# No CLI-based installers — this is a desktop tray app, not a CLI tool.
installers = []
install-updater = false

targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]
allow-dirty = ["ci", "msi"]

# No publish jobs — homebrew formula publishing has been removed
publish-jobs = []

[dist.dependencies.apt]
"libwebkit2gtk-4.1-dev" = "*"
"libgtk-3-dev" = "*"
"libayatana-appindicator3-dev" = "*"
librsvg2-dev = "*"
patchelf = "*"
libasound2-dev = "*"
libxdo-dev = "*"
clang = "*"
ninja-build = "*"
cmake = "*"
