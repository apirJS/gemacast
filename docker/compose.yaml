services:
  test:
    build:
      context: .
      dockerfile: Dockerfile.linux-test
    image: gemacast-linux-test
    volumes:
      - ..:/work
      - cargo-target:/target
      - cargo-registry:/usr/local/cargo/registry
      # Isolate Linux dependencies from host node_modules.
      - node-modules:/work/gemacast-mobile/node_modules
    working_dir: /work
    shm_size: "512m"
    environment:
      PIPEWIRE_LOG_LEVEL: "2"
    init: true

  android:
    profiles: ["android"]
    build:
      context: ..
      dockerfile: docker/Dockerfile.android-test
    image: gemacast-android-test
    volumes:
      - ..:/work
      - android-cargo-target:/target
      - android-cargo-registry:/usr/local/cargo/registry
      - android-gradle:/root/.gradle
    working_dir: /work
    shm_size: "512m"
    init: true

volumes:
  cargo-target:
  cargo-registry:
  node-modules:
  android-cargo-target:
  android-cargo-registry:
  android-gradle:
