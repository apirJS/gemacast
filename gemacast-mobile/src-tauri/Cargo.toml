[package]
name = "gemacast-mobile"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "gemacast_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
serde_json = "1"
async-trait = "0.1"
tauri-plugin-device-info = "1.0.1"
netdev = "0.43.0"
semver = "1"
futures-util = "0.3"
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
gemacast-core = { path = "../../gemacast-core" }
tokio = { version = "1.50.0", features = ["full"] }

# `release_max_level_off` compiles every `tracing::*` call in this crate and its
# dependencies out of release builds — a shipped APK emits no log output. Debug
# builds are unaffected, so `adb logcat` field captures need a `--debug` APK.
tracing = { version = "0.1.44", features = ["log", "release_max_level_off"] }

reqwest = { version = "0.12", default-features = false, features = [
  "stream",
  "rustls-tls",
] }
base64 = "0.22"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"

[dev-dependencies]
tokio = { version = "1.50.0", features = ["full", "test-util"] }
